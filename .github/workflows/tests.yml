name: MAtlasAgent core
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main, 'feat/**']
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m matlasagent --help
      - run: python -m matlasagent.desktop --help
      - run: python -m matlasagent.api --help
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: obsidian-plugin/package-lock.json
      - run: npm ci
        working-directory: obsidian-plugin
      - run: npm run build
        working-directory: obsidian-plugin
      - run: npm test
        working-directory: obsidian-plugin
        env:
          MATLAS_TEST_PYTHON: python
