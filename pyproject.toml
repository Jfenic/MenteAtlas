[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "matlasagent"
version = "0.1.0"
description = "A local personal knowledge atlas with independent libraries"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
matlas = "matlasagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
