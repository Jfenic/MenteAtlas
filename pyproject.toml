[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "matlasagent"
version = "0.2.0"
description = "A local personal knowledge atlas with independent libraries"
requires-python = ">=3.12"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
matlas = "matlasagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
